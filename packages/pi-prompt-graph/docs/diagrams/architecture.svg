<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1023.7 256" width="1023.7" height="256" role="img" aria-labelledby="diagram-title diagram-description" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif">
<title id="diagram-title">How a graph is checked and run</title>
<desc id="diagram-description">A Pi session calls the extension, which loads a graph and passes it through the pure core and resource-aware embedded runner. Independent node adapters may overlap within the graph limit while state, journal entries, and artifacts are committed to the project run directory.</desc>
<rect x="0.5" y="0.5" width="1022.7" height="255" rx="6" fill="#ffffff" stroke="#dce6f5"/>
<text x="32" y="40" font-size="17" font-family="'Domine',Georgia,'Times New Roman',serif" fill="#010c3f">How a graph is checked and run</text>
<line x1="32" y1="54" x2="991.7" y2="54" stroke="#dce6f5"/>
<defs><marker id="arrow-solid" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.8 L8,4.5 L0,8.2 z" fill="#0464cd"/></marker><marker id="arrow-dashed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.8 L8,4.5 L0,8.2 z" fill="#7a869f"/></marker></defs>
<path d="M165,110.5 C209,110.5 209,152 253,152" fill="none" stroke="#0464cd" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
<path d="M181,193.5 C217,193.5 217,152 253,152" fill="none" stroke="#0464cd" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
<path d="M413,152 C467.4,152 467.4,152 521.9,152" fill="none" stroke="#0464cd" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
<path d="M692.9,152 C747.3,152 747.3,110.5 801.7,110.5" fill="none" stroke="#0464cd" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
<path d="M692.9,152 C756.1,152 756.1,193.5 819.2,193.5" fill="none" stroke="#0464cd" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
<rect x="48" y="82" width="117" height="57" rx="4" fill="#ffffff" stroke="#032c7b" stroke-width="1.5"/>
<text x="106.5" y="107" font-size="13" font-weight="600" text-anchor="middle" fill="#010c3f">Pi session</text>
<text x="106.5" y="125" font-size="11" text-anchor="middle" fill="#5b6478">person or agent</text>
<rect x="32" y="165" width="149" height="57" rx="18" fill="#f0f5ff" stroke="#0464cd" stroke-width="1.5"/>
<text x="106.5" y="190" font-size="13" font-weight="600" text-anchor="middle" fill="#010c3f">Graph file</text>
<text x="106.5" y="208" font-size="11" text-anchor="middle" fill="#5b6478">project or user scope</text>
<rect x="253" y="116.5" width="160" height="71" rx="4" fill="#032c7b" stroke="#032c7b" stroke-width="1"/>
<text x="333" y="135.5" font-size="9" font-weight="600" letter-spacing="0.1em" text-anchor="middle" fill="#9fd47b">PI-PROMPT-GRAPH</text>
<text x="333" y="155.5" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">Graph extension</text>
<text x="333" y="173.5" font-size="11" text-anchor="middle" fill="#cfdaf0">command and tool</text>
<rect x="521.9" y="109.5" width="171" height="85" rx="4" fill="#9fd47b" stroke="#032c7b" stroke-width="1.5"/>
<text x="607.4" y="128.5" font-size="9" font-weight="600" letter-spacing="0.1em" text-anchor="middle" fill="#032c7b">CHECK AND ROUTE</text>
