<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 977.5 173" width="977.5" height="173" role="img" aria-labelledby="diagram-title diagram-description" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif">
<title id="diagram-title">Context-aware compaction handoff</title>
<desc id="diagram-description">An agent asks context-aware to prepare a self-contained seed, Pi compacts with that guidance, and the extension starts the next phase after queued input drains.</desc>
<rect x="0.5" y="0.5" width="976.5" height="172" rx="6" fill="#ffffff" stroke="#dce6f5"/>
<text x="32" y="40" font-size="17" font-family="'Domine',Georgia,'Times New Roman',serif" fill="#010c3f">Context-aware compaction handoff</text>
<line x1="32" y1="54" x2="945.5" y2="54" stroke="#dce6f5"/>
<defs><marker id="arrow-solid" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.8 L8,4.5 L0,8.2 z" fill="#0464cd"/></marker><marker id="arrow-dashed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.8 L8,4.5 L0,8.2 z" fill="#7a869f"/></marker></defs>
<path d="M202,110.5 C267.6,110.5 267.6,110.5 333.3,110.5" fill="none" stroke="#0464cd" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
<path d="M461.3,110.5 C506.9,110.5 506.9,110.5 552.5,110.5" fill="none" stroke="#0464cd" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
<path d="M704.5,110.5 C743.5,110.5 743.5,110.5 782.5,110.5" fill="none" stroke="#0464cd" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
<rect x="32" y="82" width="170" height="57" rx="4" fill="#ffffff" stroke="#032c7b" stroke-width="1.5"/>
<text x="117" y="107" font-size="13" font-weight="600" text-anchor="middle" fill="#010c3f">Agent</text>
<text x="117" y="125" font-size="11" text-anchor="middle" fill="#5b6478">chooses a clean boundary</text>
<rect x="333.3" y="82" width="128" height="57" rx="4" fill="#032c7b" stroke="#032c7b" stroke-width="1"/>
<text x="397.3" y="107" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">context-aware</text>
<text x="397.3" y="125" font-size="11" text-anchor="middle" fill="#cfdaf0">rewrites the seed</text>
<rect x="552.5" y="82" width="152" height="57" rx="4" fill="#ffffff" stroke="#032c7b" stroke-width="1.5"/>
<text x="628.5" y="107" font-size="13" font-weight="600" text-anchor="middle" fill="#010c3f">Pi compaction</text>
<text x="628.5" y="125" font-size="11" text-anchor="middle" fill="#5b6478">uses seed as guidance</text>
<rect x="782.5" y="82" width="163" height="57" rx="4" fill="#9fd47b" stroke="#032c7b" stroke-width="1.5"/>
<text x="864" y="107" font-size="13" font-weight="600" text-anchor="middle" fill="#010c3f">Next phase</text>
<text x="864" y="125" font-size="11" text-anchor="middle" fill="#010c3f">starts after queued input</text>
<rect x="216" y="101.5" width="103.3" height="18" rx="3" fill="#ffffff"/><text x="267.6" y="114.5" font-size="11" text-anchor="middle" fill="#28303f">compact_session</text>
<rect x="475.3" y="101.5" width="63.3" height="18" rx="3" fill="#ffffff"/><text x="506.9" y="114.5" font-size="11" text-anchor="middle" fill="#28303f">final seed</text>
<rect x="718.5" y="101.5" width="50" height="18" rx="3" fill="#ffffff"/><text x="743.5" y="114.5" font-size="11" text-anchor="middle" fill="#28303f">handoff</text>
<text x="945.5" y="159" font-size="9" letter-spacing="0.16em" text-anchor="end" fill="#9a9a9a">CAAIR</text>
</svg>
