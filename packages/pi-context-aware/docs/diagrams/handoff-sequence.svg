<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650.3 362" width="650.3" height="362" role="img" aria-labelledby="diagram-title diagram-description" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif">
<title id="diagram-title">Compaction handoff sequence</title>
<desc id="diagram-description">The agent gives context-aware a short seed, the extension asks the active model to rewrite it, and Pi compacts before context-aware delivers the next-phase prompt.</desc>
<rect x="0.5" y="0.5" width="649.3" height="361" rx="6" fill="#ffffff" stroke="#dce6f5"/>
<text x="32" y="40" font-size="17" font-family="'Domine',Georgia,'Times New Roman',serif" fill="#010c3f">Compaction handoff sequence</text>
<line x1="32" y1="54" x2="618.3" y2="54" stroke="#dce6f5"/>
<defs><marker id="arrow-solid" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.8 L8,4.5 L0,8.2 z" fill="#0464cd"/></marker><marker id="arrow-dashed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.8 L8,4.5 L0,8.2 z" fill="#7a869f"/></marker></defs>
<line x1="92" y1="114" x2="92" y2="328" stroke="#cfdaf0" stroke-width="1.3" stroke-dasharray="3 4"/>
<line x1="255.1" y1="114" x2="255.1" y2="328" stroke="#cfdaf0" stroke-width="1.3" stroke-dasharray="3 4"/>
<line x1="410.3" y1="114" x2="410.3" y2="328" stroke="#cfdaf0" stroke-width="1.3" stroke-dasharray="3 4"/>
<line x1="558.3" y1="114" x2="558.3" y2="328" stroke="#cfdaf0" stroke-width="1.3" stroke-dasharray="3 4"/>
<path d="M92,144 L254.1,144" fill="none" stroke="#0464cd" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
<text x="173.5" y="137" font-size="11" text-anchor="middle" fill="#28303f">compact_session(seed)</text>
<path d="M255.1,180 L409.3,180" fill="none" stroke="#0464cd" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
<text x="332.7" y="173" font-size="11" text-anchor="middle" fill="#28303f">rewrite raw seed</text>
<path d="M410.3,216 L256.1,216" fill="none" stroke="#7a869f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
<text x="332.7" y="209" font-size="11" text-anchor="middle" fill="#28303f">self-contained prompt</text>
<path d="M255.1,252 L557.3,252" fill="none" stroke="#0464cd" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
<text x="406.7" y="245" font-size="11" text-anchor="middle" fill="#28303f">compact(final seed)</text>
<path d="M255.1,288 L93,288" fill="none" stroke="#7a869f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
<text x="173.5" y="281" font-size="11" text-anchor="middle" fill="#28303f">start next phase</text>
<rect x="32" y="76" width="120" height="38" rx="4" fill="#ffffff" stroke="#032c7b" stroke-width="1.5"/>
<text x="92" y="100" font-size="13" font-weight="600" text-anchor="middle" fill="#010c3f">Agent</text>
<rect x="191.1" y="76" width="128" height="38" rx="4" fill="#032c7b" stroke="#032c7b" stroke-width="1"/>
<text x="255.1" y="100" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">context-aware</text>
<rect x="350.3" y="76" width="120" height="38" rx="4" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="410.3" y="100" font-size="13" font-weight="600" text-anchor="middle" fill="#28303f">Active model</text>
<rect x="498.3" y="76" width="120" height="38" rx="4" fill="#ffffff" stroke="#032c7b" stroke-width="1.5"/>
<text x="558.3" y="100" font-size="13" font-weight="600" text-anchor="middle" fill="#010c3f">Pi</text>
<text x="618.3" y="348" font-size="9" letter-spacing="0.16em" text-anchor="end" fill="#9a9a9a">CAAIR</text>
</svg>
