title: Ship the widget importer
description: !md |
  One-paragraph summary of the outcome (what — feeds listings/status).
intent: !md |
  Why this work exists; constraints and non-goals (feeds worker briefs).
links:
  - url: https://example.com/issues/12
    note: originating issue
corrects:
  - spec: 0031-widget-export.yaml
    reason: export path changed by this work
open_decisions:
  - id: OD1
    question: Which auth mode does the importer use?
    tripwire: before decomposing the auth subtree
    decides: user
work:
  - id: schema
    task: Define the import schema and validators
    description: !md |
      Context the worker needs beyond the task line.
    touches: [src/import/schema/**]
    refs:
      - path: src/export/schema.ts
        lines: 10-80
        why: mirror the export naming
    worker:
      profile: premium
      agent: implementer
      skills: [implement-typescript]
      model: openai/gpt-5.6-sol
    acceptance:
      - id: A1
        statement: Importing the fixture set produces zero validation errors
        evidence:
          kind: command
          run: !bash |
            npm test -- import/schema
          expect:
            exit: 0
            output_includes: passed
  - id: docs
    task: Update the importer runbook
    depends_on: [schema]
    checklist:
      - document the fixture workflow
      - add troubleshooting section
      - link from README
    acceptance:
      - id: A2
        statement: Runbook covers install, run, troubleshoot
        evidence:
          kind: agent
          agent: reviewer
          inputs: [docs/importer.md]
          rubric: !md |
            Approve only if all three sections exist and match the code.
