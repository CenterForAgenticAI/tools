<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020.3 339" width="1020.3" height="339" role="img" aria-labelledby="diagram-title diagram-description" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif">
<title id="diagram-title">pi-work plans and proves one work graph</title>
<desc id="diagram-description">A Pi session uses pi-work to read and write workspec files, inspect a Git worktree, and hand one compiled node to pi-delegate for isolated worker execution.</desc>
