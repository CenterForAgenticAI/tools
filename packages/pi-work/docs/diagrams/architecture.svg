<path d="M452.9,193.5 C529.9,193.5 529.9,193.5 606.8,193.5" fill="none" stroke="#0464cd" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
<path d="M753.8,193.5 C799.1,193.5 799.1,193.5 844.3,193.5" fill="none" stroke="#0464cd" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
<rect x="32" y="158" width="156" height="71" rx="4" fill="#ffffff" stroke="#032c7b" stroke-width="1.5"/>
