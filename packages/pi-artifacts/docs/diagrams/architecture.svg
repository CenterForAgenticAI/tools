<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 992.3 270" width="992.3" height="270" role="img" aria-labelledby="diagram-title diagram-description" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif">
<title id="diagram-title">How Pi sessions register and view artifacts</title>
<desc id="diagram-description">Pi sessions and the command-line client send files to one local daemon. The daemon keeps metadata and snapshots, then serves the explorer and viewers through Tailscale Serve to browsers on the same tailnet.</desc>
