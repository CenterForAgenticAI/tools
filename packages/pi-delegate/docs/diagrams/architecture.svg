<text x="380.2" y="190" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">pi-delegate</text>
<text x="380.2" y="208" font-size="11" text-anchor="middle" fill="#cfdaf0">dispatch, supervise, control</text>
