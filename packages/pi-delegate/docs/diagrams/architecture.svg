<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 759.2 399" width="759.2" height="399" role="img" aria-labelledby="diagram-title diagram-description" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif">
<title id="diagram-title">pi-delegate architecture</title>
<desc id="diagram-description">A Pi session asks pi-delegate to start worker, supervised, or durable driver runs; pi-delegate stores bounded state and delivers each completed result to the owning session.</desc>
