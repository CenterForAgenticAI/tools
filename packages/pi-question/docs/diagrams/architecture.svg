<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 972.6 478" width="972.6" height="478" role="img" aria-labelledby="diagram-title diagram-description" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif">
<title id="diagram-title">How an ask reaches a human</title>
<desc id="diagram-description">The agent calls ask; the tool normalises the questions, picks one answer surface from declared capability, and narrates the answers back. Only the dialogs and none surfaces exist today.</desc>
