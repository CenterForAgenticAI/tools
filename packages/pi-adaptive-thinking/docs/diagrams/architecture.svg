<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 781.6 389" width="781.6" height="389" role="img" aria-labelledby="diagram-title diagram-description" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif">
<title id="diagram-title">Adaptive thinking in one Pi session</title>
<desc id="diagram-description">The agent, user, and inherited policy send bounded choices to adaptive-thinking. The extension checks the active model and updates the Pi session's thinking level, prompt guidance, and status.</desc>
