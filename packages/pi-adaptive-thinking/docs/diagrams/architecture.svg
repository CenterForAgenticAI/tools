<text x="113.5" y="139" font-size="11" text-anchor="middle" fill="#5b6478">calls set_thinking_effort</text>
<rect x="40" y="179" width="147" height="57" rx="4" fill="#ffffff" stroke="#032c7b" stroke-width="1.5"/>
<text x="113.5" y="204" font-size="13" font-weight="600" text-anchor="middle" fill="#010c3f">User</text>
<text x="113.5" y="222" font-size="11" text-anchor="middle" fill="#5b6478">commands and config</text>
<rect x="32" y="262" width="163" height="57" rx="4" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="113.5" y="287" font-size="13" font-weight="600" text-anchor="middle" fill="#28303f">Inherited policy</text>
