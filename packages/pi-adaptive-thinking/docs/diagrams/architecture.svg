<path d="M678.6,229 L678.6,336 Q678.6,345 669.6,345 L409.6,345 Q400.6,345 400.6,336 L400.6,237" fill="none" stroke="#7a869f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
<rect x="33" y="82" width="161" height="71" rx="4" fill="#ffffff" stroke="#032c7b" stroke-width="1.5"/>
<text x="113.5" y="101" font-size="9" font-weight="600" letter-spacing="0.1em" text-anchor="middle" fill="#0464cd">PI SESSION</text>
