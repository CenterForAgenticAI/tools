<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 929.3 292" width="929.3" height="292" role="img" aria-labelledby="diagram-title diagram-description" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif">
<title id="diagram-title">How clients use pi-daemon</title>
<desc id="diagram-description">A CLI or library client connects over a private Unix socket to one local daemon. The daemon hosts Pi sessions in process, keeps durable history in Pi session JSONL, and stores rebuildable operational indexes in SQLite.</desc>
