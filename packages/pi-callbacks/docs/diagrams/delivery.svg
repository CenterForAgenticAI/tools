<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 652.1 422" width="652.1" height="422" role="img" aria-labelledby="diagram-title diagram-description" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif">
<title id="diagram-title">How a finished job reaches a session</title>
<desc id="diagram-description">The daemon writes a delivery event to the store. A target resolver picks a live session, and that session claims the event with a short lease before injecting it, so two sessions never consume the same event.</desc>
<rect x="0.5" y="0.5" width="651.1" height="421" rx="6" fill="#ffffff" stroke="#dce6f5"/>
<text x="32" y="40" font-size="17" font-family="'Domine',Georgia,'Times New Roman',serif" fill="#010c3f">How a finished job reaches a session</text>
<line x1="32" y1="54" x2="620.1" y2="54" stroke="#dce6f5"/>
<defs><marker id="arrow-solid" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.8 L8,4.5 L0,8.2 z" fill="#0464cd"/></marker><marker id="arrow-dashed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.8 L8,4.5 L0,8.2 z" fill="#7a869f"/></marker></defs>
<line x1="92" y1="114" x2="92" y2="388" stroke="#cfdaf0" stroke-width="1.3" stroke-dasharray="3 4"/>
<line x1="248.6" y1="114" x2="248.6" y2="388" stroke="#cfdaf0" stroke-width="1.3" stroke-dasharray="3 4"/>
<line x1="412.1" y1="114" x2="412.1" y2="388" stroke="#cfdaf0" stroke-width="1.3" stroke-dasharray="3 4"/>
<line x1="560.1" y1="114" x2="560.1" y2="388" stroke="#cfdaf0" stroke-width="1.3" stroke-dasharray="3 4"/>
<path d="M92,144 L247.6,144" fill="none" stroke="#0464cd" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
<text x="170.3" y="137" font-size="11" text-anchor="middle" fill="#28303f">append delivery event</text>
<path d="M412.1,180 L249.6,180" fill="none" stroke="#0464cd" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
<text x="330.3" y="173" font-size="11" text-anchor="middle" fill="#28303f">drain: claim with lease</text>
<path d="M248.6,216 L411.1,216" fill="none" stroke="#7a869f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
<text x="330.3" y="209" font-size="11" text-anchor="middle" fill="#28303f">event, if routed here</text>
<rect x="172.6" y="252" width="315.6" height="42" rx="3" fill="#f0f5ff" stroke="#dce6f5"/>
<rect x="172.6" y="252" width="3" height="42" fill="#0464cd"/>
<text x="186.6" y="269" font-size="11" fill="#28303f">Origin, latest-active, latest-active-cwd or session</text>
<text x="186.6" y="283" font-size="11" fill="#28303f">decides who may claim.</text>
<path d="M412.1,312 L559.1,312" fill="none" stroke="#0464cd" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
<text x="486.1" y="305" font-size="11" text-anchor="middle" fill="#28303f">inject message</text>
<path d="M412.1,348 L249.6,348" fill="none" stroke="#0464cd" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
<text x="330.3" y="341" font-size="11" text-anchor="middle" fill="#28303f">mark delivered</text>
<rect x="32" y="76" width="120" height="38" rx="4" fill="#032c7b" stroke="#032c7b" stroke-width="1"/>
<text x="92" y="100" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">Daemon</text>
<rect x="188.6" y="76" width="120" height="38" rx="19" fill="#f0f5ff" stroke="#0464cd" stroke-width="1.5"/>
<text x="248.6" y="100" font-size="13" font-weight="600" text-anchor="middle" fill="#010c3f">Store</text>
<rect x="352.1" y="76" width="120" height="38" rx="4" fill="#032c7b" stroke="#032c7b" stroke-width="1"/>
<text x="412.1" y="100" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">Extension</text>
<rect x="500.1" y="76" width="120" height="38" rx="4" fill="#ffffff" stroke="#032c7b" stroke-width="1.5"/>
<text x="560.1" y="100" font-size="13" font-weight="600" text-anchor="middle" fill="#010c3f">Agent</text>
<text x="620.1" y="408" font-size="9" letter-spacing="0.16em" text-anchor="end" fill="#9a9a9a">CAAIR</text>
</svg>
