<rect x="274.5" y="202" width="56.2" height="18" rx="3" fill="#ffffff"/><text x="302.6" y="215" font-size="11" text-anchor="middle" fill="#28303f">callback</text>
<rect x="678.6" y="170.8" width="42.9" height="18" rx="3" fill="#ffffff"/><text x="700" y="183.8" font-size="11" text-anchor="middle" fill="#28303f">check</text>
<rect x="426.9" y="253" width="88" height="18" rx="3" fill="#ffffff"/><text x="470.8" y="266" font-size="11" text-anchor="middle" fill="#28303f">delivery event</text>
<text x="913" y="292" font-size="9" letter-spacing="0.16em" text-anchor="end" fill="#9a9a9a">CAAIR</text>
