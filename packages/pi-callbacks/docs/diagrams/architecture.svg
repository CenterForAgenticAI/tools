<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 945 306" width="945" height="306" role="img" aria-labelledby="diagram-title diagram-description" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif">
<title id="diagram-title">One daemon per machine, many Pi sessions</title>
<desc id="diagram-description">Pi sessions create jobs through the extension. One central daemon per machine runs timers, polls and scripts, keeps jobs in a shared store, and hands finished results back to the session that owns them. External scripts call the daemon directly with a token.</desc>
<rect x="0.5" y="0.5" width="944" height="305" rx="6" fill="#ffffff" stroke="#dce6f5"/>
<text x="32" y="40" font-size="17" font-family="'Domine',Georgia,'Times New Roman',serif" fill="#010c3f">One daemon per machine, many Pi sessions</text>
<line x1="32" y1="54" x2="913" y2="54" stroke="#dce6f5"/>
<defs><marker id="arrow-solid" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.8 L8,4.5 L0,8.2 z" fill="#0464cd"/></marker><marker id="arrow-dashed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.8 L8,4.5 L0,8.2 z" fill="#7a869f"/></marker></defs>
<path d="M186,117.5 C228.1,117.5 228.1,139 270.2,139" fill="none" stroke="#0464cd" stroke-width="1.5" marker-end="url(#arrow-solid)"/>
