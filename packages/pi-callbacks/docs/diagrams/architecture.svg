<path d="M176,207.5 C302.6,207.5 302.6,214.5 429.2,214.5 C476.1,214.5 476.1,159 523,159" fill="none" stroke="#7a869f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
<path d="M661,159 C700,159 700,200.5 739,200.5" fill="none" stroke="#7a869f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
<path d="M592,194.5 L592,253 Q592,262 583,262 L358.7,262 Q349.7,262 349.7,253 L349.7,182.5" fill="none" stroke="#7a869f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
<rect x="32" y="82" width="154" height="71" rx="4" fill="#ffffff" stroke="#032c7b" stroke-width="1.5"/>
<text x="109" y="101" font-size="9" font-weight="600" letter-spacing="0.1em" text-anchor="middle" fill="#0464cd">PI SESSION</text>
<text x="109" y="121" font-size="13" font-weight="600" text-anchor="middle" fill="#010c3f">Agent</text>
<text x="109" y="139" font-size="11" text-anchor="middle" fill="#5b6478">calls the callbacks tool</text>
<rect x="42" y="179" width="134" height="57" rx="4" fill="#f7f7f7" stroke="#9a9a9a" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="109" y="204" font-size="13" font-weight="600" text-anchor="middle" fill="#28303f">External script</text>
<text x="109" y="222" font-size="11" text-anchor="middle" fill="#5b6478">posts a token</text>
<rect x="270.2" y="96.5" width="159" height="85" rx="4" fill="#032c7b" stroke="#032c7b" stroke-width="1"/>
<text x="349.7" y="115.5" font-size="9" font-weight="600" letter-spacing="0.1em" text-anchor="middle" fill="#9fd47b">PI-CALLBACKS</text>
